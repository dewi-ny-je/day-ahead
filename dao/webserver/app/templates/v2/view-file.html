{% extends "v2/base.html" %}

{% block title %}{{ filename }} - DAO{% endblock %}
{% block content %}
<h1>Log</h1>

<code class="mt-3">{{ filename }}</code>
<code-input
    template="syntax-highlighted"
    class="line-numbers flex-grow-1"
    style="overflow:auto;"
>
    <textarea name="logdata" readonly data-code-input-fallback>{{ content }}</textarea>
</code-input>

{% endblock %}
