{% extends "v2/base.html" %}

{% block title %}Secrets - DAO{% endblock %}
{% block content %}
<h1>Secrets</h1>
<form method="POST" class="flex-grow-1 d-flex flex-column">
    <div class="code-editor flex-grow-1" data-code-editor="json">
        <textarea name="secrets" class="form-control font-monospace" rows="25" spellcheck="false">{{ content }}</textarea>
    </div>

    <button class="btn btn-primary mt-2 col-2">
        <i class="bi bi-floppy"></i> Save secrets
    </button>
</form>
{% endblock %}
