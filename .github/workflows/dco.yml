name: DCO

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  signoff:
    name: Check commit sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify Signed-off-by on every commit of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author_email=$(git log -1 --format='%ae' "$sha")
            case "$author_email" in
              *'[bot]@users.noreply.github.com') continue ;;
            esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q .; then
              echo "::error::Commit $sha ($(git log -1 --format='%s' "$sha")) has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the sign-off with 'git commit --amend -s --no-edit' or 'git rebase --signoff $BASE_SHA', then force-push. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off."
