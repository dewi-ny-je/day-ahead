name: Build and publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Add-on to build when no release tag is given, or to bump when a new non-rc release tag is given"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - testing
      release_tag:
        description: "Release tag to build (leave empty to use the version from config.yaml; a new version is written into config.yaml and committed first)"
        required: false
        type: string
      architectures:
        description: "Architecture(s) to build"
        required: false
        default: all
        type: choice
        options:
          - all
          - amd64
          - aarch64
      publish_manifest:
        description: "Publish the multi-architecture manifest after a single-architecture build (the other architecture must already be published for this tag)"
        required: false
        default: false
        type: boolean

  release:
    types: [published]

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: dao

permissions:
  contents: read

jobs:

  init:
    name: Initialize build
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      app_dir: ${{ steps.detect.outputs.app_dir }}
      version: ${{ steps.detect.outputs.version }}
      image_tags: ${{ steps.detect.outputs.image_tags }}
      publish_manifest: ${{ steps.arch.outputs.publish_manifest }}
      commit: ${{ steps.detect.outputs.commit }}

    permissions:
      contents: write

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      # A manually given release tag that is in neither config.yaml is a new
      # version: write it into the add-on's config.yaml and commit it, so the
      # image is built from a tree that carries the version it is tagged with
      - name: Write new version into config.yaml
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          CHANNEL_INPUT: ${{ inputs.channel }}
        run: |
          VERSION="${RELEASE_TAG_INPUT#v}"
          VERSION="${VERSION// /}"

          DAO_VERSION=$(grep '^version:' dao/config.yaml | awk '{print $2}')
          TEST_VERSION=$(grep '^version:' release-testing/config.yaml | awk '{print $2}')

          if [[ "${VERSION}" == "${DAO_VERSION}" || "${VERSION}" == "${TEST_VERSION}" ]]; then
            echo "${VERSION} is already in config.yaml, nothing to bump"
            exit 0
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+(\.rc[0-9]*)?$ ]]; then
            echo "::error::'${VERSION}' is not a valid version (expected 2026.9.2 or 2026.9.2.rc1)"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::${VERSION} is not in config.yaml and ${GITHUB_REF_NAME} is not a branch the bump can be committed to"
            exit 1
          fi

          # A release candidate always goes to the testing add-on
          if [[ "${VERSION}" == *rc* ]]; then
            APP_DIR="release-testing"
          elif [[ "${CHANNEL_INPUT:-stable}" == "testing" ]]; then
            APP_DIR="release-testing"
          else
            APP_DIR="dao"
          fi

          CURRENT=$(grep '^version:' "${APP_DIR}/config.yaml" | awk '{print $2}')
          sed -i -E "s|^version:.*|version: ${VERSION}|" "${APP_DIR}/config.yaml"
          echo "${APP_DIR}/config.yaml: ${CURRENT} -> ${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${APP_DIR}/config.yaml"
          git commit -m "${VERSION}"

          for DELAY in 2 4 8 16 0; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [[ "${DELAY}" == "0" ]]; then
              echo "::error::Could not push the version bump"
              exit 1
            fi
            echo "Push failed, retrying in ${DELAY}s"
            sleep "${DELAY}"

            # The branch may have moved on meanwhile, in which case every
            # retry would be rejected again: replay the bump on top of it
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::${GITHUB_REF_NAME} changed and the version bump does not apply on top of it"
              exit 1
            fi
          done

      - name: Detect release type
        id: detect
        shell: bash
        env:
          RELEASE_TAG_EVENT: ${{ github.event.release.tag_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          CHANNEL_INPUT: ${{ inputs.channel }}
        run: |
          DAO_VERSION=$(grep '^version:' dao/config.yaml | awk '{print $2}')
          TEST_VERSION=$(grep '^version:' release-testing/config.yaml | awk '{print $2}')

          RELEASE_TAG="${RELEASE_TAG_EVENT}"
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="${RELEASE_TAG_INPUT#v}"
            RELEASE_TAG="${RELEASE_TAG// /}"
          fi
          if [[ -z "$RELEASE_TAG" ]]; then
            # No tag given: take the version straight from config.yaml
            CHANNEL="${CHANNEL_INPUT:-stable}"
            if [[ "${CHANNEL}" == "testing" ]]; then
              RELEASE_TAG="${TEST_VERSION}"
            else
              RELEASE_TAG="${DAO_VERSION}"
            fi
            echo "No release tag given, building the ${CHANNEL} version from config.yaml"
          fi

          echo "Release tag:     ${RELEASE_TAG}"
          echo "DAO version:     ${DAO_VERSION}"
          echo "Testing version: ${TEST_VERSION}"

          # The commit checked out here, including a version bump made above
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [[ "${RELEASE_TAG}" == "${DAO_VERSION}" ]]; then
            echo "Detected stable release"

            echo "app_dir=dao" >> "$GITHUB_OUTPUT"
            echo "version=${DAO_VERSION}" >> "$GITHUB_OUTPUT"

            {
              echo "image_tags<<EOF"
              echo "${DAO_VERSION}"
              echo "stable"
              echo "latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

          elif [[ "${RELEASE_TAG}" == "${TEST_VERSION}" ]]; then
            echo "Detected testing release"

            echo "app_dir=release-testing" >> "$GITHUB_OUTPUT"
            echo "version=${TEST_VERSION}" >> "$GITHUB_OUTPUT"

            {
              echo "image_tags<<EOF"
              echo "${TEST_VERSION}"
              echo "testing"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

          else
            echo "ERROR: release tag '${RELEASE_TAG}' does not match:"
            echo "  dao/config.yaml: ${DAO_VERSION}"
            echo "  release-testing/config.yaml: ${TEST_VERSION}"
            exit 1
          fi

      - name: Select architectures
        id: arch
        shell: bash
        env:
          ALL_ARCHITECTURES: ${{ env.ARCHITECTURES }}
          ARCHITECTURES_INPUT: ${{ inputs.architectures }}
          PUBLISH_MANIFEST_INPUT: ${{ inputs.publish_manifest }}
        run: |
          SELECTION="${ARCHITECTURES_INPUT:-all}"

          if [[ "${SELECTION}" == "all" ]]; then
            ARCHITECTURES="${ALL_ARCHITECTURES}"
            # A complete build always gets its manifest
            PUBLISH_MANIFEST="true"
          else
            ARCHITECTURES="[\"${SELECTION}\"]"
            # A partial build only publishes the arch image, unless asked
            # explicitly: the manifest needs every architecture of this tag
            PUBLISH_MANIFEST="${PUBLISH_MANIFEST_INPUT:-false}"
          fi

          echo "Building:         ${ARCHITECTURES}"
          echo "Publish manifest: ${PUBLISH_MANIFEST}"

          {
            echo "architectures=${ARCHITECTURES}"
            echo "publish_manifest=${PUBLISH_MANIFEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare multi-architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.arch.outputs.architectures }}
          image-name: ${{ env.IMAGE_NAME }}


  build:
    name: Build ${{ matrix.arch }} image
    needs: init

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.init.outputs.commit }}

      - name: Prepare testing build context
        if: needs.init.outputs.app_dir == 'release-testing'
        run: |
          cp -a dao/* release-testing/

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}

          image: ${{ matrix.image }}

          context: ${{ needs.init.outputs.app_dir }}

          container-registry: ghcr.io
          container-registry-username: ${{ github.repository_owner }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

          image-tags: ${{ needs.init.outputs.image_tags }}

          version: ${{ needs.init.outputs.version }}

          push: "true"

          cache-gha: "true"
          cache-gha-scope: ${{ needs.init.outputs.app_dir }}


  manifest:
    name: Publish multi-architecture manifest
    needs:
      - init
      - build

    if: needs.init.outputs.publish_manifest == 'true'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      packages: write

    steps:

      # Always the complete set of architectures: the manifest describes the
      # image as a whole, also when only one architecture was rebuilt
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}

          image-name: ${{ env.IMAGE_NAME }}

          container-registry: ghcr.io
          container-registry-username: ${{ github.repository_owner }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

          image-tags: ${{ needs.init.outputs.image_tags }}
